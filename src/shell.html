<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline';"
  />
  <title>我的桌面应用</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>我的应用</div>
      <nav class="nav" id="nav"></nav>
    </header>

    <!-- 标签页栏 -->
    <div class="tabbar" id="tabbar"></div>

    <!-- 内容区：每个打开的页面一个 webview -->
    <main class="content" id="content">
      <div class="placeholder" id="placeholder">
        <p class="placeholder-title">还没有打开的页面</p>
        <p class="placeholder-sub">点击上方菜单打开一个页面</p>
      </div>
    </main>
  </div>

  <script src="shell.js"></script>
</body>
</html>
