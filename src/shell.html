<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta

    content="default-src 'self'; style-src 'self' 'unsafe-inline';"
  />
  <title>我的桌面应用</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand"><span class="brand-dot"></span>我的应用</div>

    <main class="content">
      <webview id="view" src="about:blank"></webview>
    </main>
  </div>

  <script src="shell.js"></script>

</html>
